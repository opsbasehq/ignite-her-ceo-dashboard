<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IGNITE Her — CEO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6e1e39;
    --maroon-dark:#54172c;
    --maroon-light:#a24d6c;
    --maroon-light-dark:#8a3a58;
    --gold:#b8863f;
    --cream:#f7f2e9;
    --card:#ffffff;
    --ink:#2c2420;
    --ink-secondary:#6b6058;
    --ink-muted:#948a80;
    --line:#e8e0d3;
    --good:#3f7d54;
    --bad:#b5482f;
    --flat:#948a80;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:16px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px;}
  header.top{
    background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));
    color:#fff;
    padding:30px 24px 26px;
  }
  header.top .top-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .header-tag{
    display:inline-block;
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:#fbf3e6;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);
    padding:4px 10px;border-radius:6px;white-space:nowrap;
  }
  .brand .wordmark{
    font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:36px;
    color:#fff;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .brand .sub{font-size:17px;color:#e8dccd;font-weight:600;}

  .meta-row{
    background:var(--card);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 8px rgba(0,0,0,0.04);
  }
  .meta-row-inner{
    max-width:1180px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .meta-left .weekly{font-size:15px;font-weight:700;color:var(--maroon);}
  .meta-left .prevweek{font-size:13.5px;color:var(--ink-secondary);margin-top:2px;}
  .meta-right{text-align:right;}
  .meta-right .rd{text-align:right;}
  .meta-right .label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);}
  .meta-right .date{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;}

  /* Category tab bar */
  .tab-bar{
    display:flex;
    gap:4px;
    border-bottom:2px solid var(--line);
    margin:22px 0 6px;
    overflow-x:auto;
  }
  .tab-btn{
    background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    padding:10px 4px;margin-right:26px;font-size:15.5px;font-weight:700;color:var(--ink-secondary);
    font-family:inherit;white-space:nowrap;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--maroon);}
  .legend-note{font-size:12.5px;color:var(--ink-muted);font-style:italic;margin:0 0 22px;}

  .hero{
    background:#fdfaf5;
    border:1px solid var(--line);
    border-left:5px solid var(--maroon);
    border-radius:var(--radius);
    padding:22px 26px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:22px;
  }
  .hero .hero-main{min-width:190px;}
  .hero .label{font-size:14.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--maroon);}
  .hero .value{font-family:'Fraunces',serif;font-size:56px;font-weight:700;color:var(--maroon-dark);margin-top:6px;line-height:1;}
  .hero .change{font-size:15.5px;font-weight:700;margin-top:8px;}
  .hero .change.good{color:var(--good);}
  .hero .change.bad{color:var(--bad);}
  .hero .change.flat{color:var(--flat);}
  .hero .components{display:flex;gap:14px;flex-wrap:wrap;flex:1;}
  .hero .comp{
    background:#faf5ec;border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;flex:1;min-width:160px;
  }
  .hero .comp .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-secondary);}
  .hero .comp .ksub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .hero .comp .v{font-size:28px;font-weight:700;font-family:'Fraunces',serif;color:var(--ink);margin-top:8px;}
  .hero .comp .c{font-size:13px;font-weight:700;margin-top:4px;}
  .hero .comp .c.good{color:var(--good);}
  .hero .comp .c.bad{color:var(--bad);}
  .hero .comp .c.flat{color:var(--flat);}

  .moved-box{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:20px;
  }
  .moved-box h3{margin:0 0 10px;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--maroon);font-weight:700;}
  .moved-box ul{margin:0;padding-left:18px;}
  .moved-box li{font-size:15px;color:var(--ink-secondary);padding:4px 0;line-height:1.55;}

  .pulse-box{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:20px;
  }
  .pulse-box h3{margin:0 0 12px;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--maroon);font-weight:700;}
  .pulse-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:860px){.pulse-grid{grid-template-columns:repeat(2,1fr);}}
  .pulse-item .pk{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700;}
  .pulse-item .pv{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);margin-top:4px;}
  .pulse-item .pc{font-size:13px;margin-top:2px;}
  .pulse-item .prow{font-size:14.5px;color:var(--ink);margin-top:6px;display:flex;align-items:baseline;gap:6px;}
  .pulse-item .prow .plabel{color:var(--ink-secondary);font-weight:600;min-width:58px;}
  .pulse-item .prow .pval{font-weight:700;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  .grid.two{grid-template-columns:repeat(2,1fr);}
  .grid.three{grid-template-columns:repeat(3,1fr);}
  @media (max-width:860px){.grid,.grid.two,.grid.three{grid-template-columns:1fr;}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .card h3{
    margin:0 0 14px;
    font-size:14.5px;
    color:var(--maroon);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card .subtitle{
    font-size:12px;color:var(--ink-muted);text-transform:none;letter-spacing:0;font-weight:500;margin-top:2px;display:block;
  }
  .card h3 .badge{
    font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-muted);
  }
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:15.5px;}
  .row .rlabel{color:var(--ink-secondary);flex:1;min-width:0;}
  .row .rval{font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;}
  .row-emph .rlabel{font-weight:600;color:var(--ink);}
  .row-emph .rval{font-size:19px;color:var(--maroon);}
  .stat{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;}
  .stat .num{font-family:'Fraunces',serif;font-size:36px;font-weight:600;}
  .chg{font-size:14px;font-weight:700;}
  .chg.good{color:var(--good);}
  .chg.bad{color:var(--bad);}
  .chg.flat{color:var(--flat);}
  .footnote{font-size:13px;color:var(--ink-muted);margin-top:10px;line-height:1.55;}
  .footnote-top{margin-top:-2px;margin-bottom:10px;}
  .list-simple{margin:0;padding:0;list-style:none;}
  .list-simple li{font-size:15px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink-secondary);line-height:1.5;}
  .list-simple li:first-child{border-top:none;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);font-weight:700;margin:28px 0 12px;}
  .section-title:first-child{margin-top:0;}
  .section-title-lg{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--maroon);
    margin:18px 0 14px;letter-spacing:-0.01em;
  }
  .webinar-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;
    padding-bottom:10px;margin-top:2px;border-bottom:1px solid var(--line);
  }
  .webinar-row{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:16px 0;border-bottom:1px solid var(--line);
  }
  .webinar-row:last-child{border-bottom:none;padding-bottom:4px;}
  .webinar-row .wname{font-size:16px;color:var(--ink);font-weight:600;}
  .webinar-row .wval{
    font-size:19px;font-weight:700;color:var(--maroon-dark);font-family:'Fraunces',serif;white-space:nowrap;
  }
  .df-col{display:flex;flex-direction:column;}
  .radio-line{
    font-size:12.5px;color:var(--ink-muted);margin-top:8px;padding:0 2px;
  }
  .data-notes{
    background:#fbf3e6;border:1px solid #e9d3a8;border-radius:var(--radius);
    padding:16px 20px;margin-bottom:20px;font-size:14.5px;color:#7a5b1f;line-height:1.55;
  }
  .data-notes strong{display:block;margin-bottom:6px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;}
  .bar-track{height:9px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--maroon));}
  .goal-note{font-size:13.5px;color:var(--ink-secondary);margin-top:6px;}
  .tgim-block{margin-bottom:14px;}
  .tgim-block:last-child{margin-bottom:0;}
  .tgim-block .tgim-label{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:4px;}
  footer.meta{margin-top:36px;font-size:13px;color:var(--ink-muted);text-align:center;}
  .empty{color:var(--ink-muted);font-size:14.5px;font-style:italic;}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="wordmark">IGNITE Her®</div>
      <h1>CEO Dashboard</h1>
    </div>
    <div class="header-tag">Internal — Team &amp; CEO Only</div>
  </div>
</header>

<div class="meta-row">
  <div class="meta-row-inner" id="metaRow"></div>
</div>

<div class="wrap">
  <div id="hero"><p class="empty">Loading dashboard data…</p></div>

  <div class="tab-bar" id="tabBar"></div>
  <div class="section-title-lg" id="sectionTitle"></div>
  <div class="legend-note" id="legendNote">All changes are vs last week: ↑ Increase · ↓ Decrease · — No change</div>

  <div id="app"></div>

  <footer class="meta">Source: 2026 CEO Dashboard workbook · weekly Mon–Sun cycle | Showing: <span id="footerRange"></span></footer>
</div>

<script>
const fmtInt = n => (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString('en-US');
const fmt1 = n => (n === null || n === undefined) ? '—' : (Math.round(n*10)/10).toLocaleString('en-US');
const fmtMoney = n => (n === null || n === undefined) ? '—' : '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPct = n => (n === null || n === undefined) ? '—' : (Math.round(n*1000)/10) + '%';
const fmtPct1 = n => (n === null || n === undefined) ? '—' : (Math.round(n*10)/10) + '%';

function changeSpan(delta) {
  if (delta === null || delta === undefined) return '<span class="chg flat">—</span>';
  const rounded = Math.round(delta*10)/10;
  let cls = 'flat', arrow = '—';
  if (rounded > 0) { cls = 'good'; arrow = '↑'; }
  else if (rounded < 0) { cls = 'bad'; arrow = '↓'; }
  const sign = rounded > 0 ? '+' : '';
  return `<span class="chg ${cls}">${arrow} ${sign}${fmt1(rounded)}</span>`;
}
function arrowVal(delta) {
  // "↑ 36.8" / "↓ 18.8" / "— 0" style, no plus sign — used in compact inline rows
  if (delta === null || delta === undefined) return '<span class="chg flat">—</span>';
  const rounded = Math.round(delta*10)/10;
  let cls = 'flat', arrow = '—';
  if (rounded > 0) { cls = 'good'; arrow = '↑'; }
  else if (rounded < 0) { cls = 'bad'; arrow = '↓'; }
  return `<span class="chg ${cls}">${arrow} ${fmt1(Math.abs(rounded))}</span>`;
}
function heroChange(delta, cssClass) {
  // "↑ 1 vs last wk" / "↓ 1 vs last wk" / "— 0 vs last wk" style used in the PDF hero
  if (delta === null || delta === undefined) return `<span class="${cssClass} flat">— vs last wk</span>`;
  const rounded = Math.round(delta*10)/10;
  let cls = 'flat', arrow = '—';
  if (rounded > 0) { cls = 'good'; arrow = '↑'; }
  else if (rounded < 0) { cls = 'bad'; arrow = '↓'; }
  return `<span class="${cssClass} ${cls}">${arrow} ${fmt1(Math.abs(rounded))} vs last wk</span>`;
}
function changeLabel(delta, val) {
  // "0 (no change)" / "N (+delta)" style used in the PDF
  if (delta === null || delta === undefined) return '';
  const rounded = Math.round(delta*10)/10;
  if (rounded === 0) return '<span class="chg flat">(no change)</span>';
  const sign = rounded > 0 ? '+' : '';
  const cls = rounded > 0 ? 'good' : 'bad';
  return `<span class="chg ${cls}">(${sign}${fmt1(rounded)} vs last wk)</span>`;
}

function renderList(items) {
  if (!items || !items.length) return '<p class="empty">Nothing currently listed.</p>';
  return `<ul class="list-simple">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
}

let DATA = null;

function heroHTML(d) {
  return `
    <div class="hero">
      <div class="hero-main">
        <div class="label">Total IGNITE Clients</div>
        <div class="value">${fmtInt(d.total_clients.value)}</div>
        ${heroChange(d.total_clients.change, 'change')}
      </div>
      <div class="components">
        <div class="comp">
          <div class="k">IGNITE Her University</div>
          <div class="ksub">Coach School + University</div>
          <div class="v">${fmtInt(d.university.value)}</div>
          ${heroChange(d.university.change, 'c')}
        </div>
        <div class="comp">
          <div class="k">Red Rebelle Room</div>
          <div class="ksub">Drop + Room</div>
          <div class="v">${fmtInt(d.red_rebelle.value)}</div>
          ${heroChange(d.red_rebelle.change, 'c')}
        </div>
        <div class="comp">
          <div class="k">IGNITE Programs</div>
          <div class="ksub">LAB · Launchpad · Design Hub · Incubator</div>
          <div class="v">${fmtInt(d.programs.value)}</div>
          ${heroChange(d.programs.change, 'c')}
        </div>
      </div>
    </div>
    ${d.what_moved_this_week_curated ? `
    <div class="moved-box">
      <h3>What moved this week</h3>
      <ul>${d.what_moved_this_week_curated.map(m=>`<li>${m}</li>`).join('')}</ul>
    </div>` : ''}
    <div class="pulse-box">
      <h3>Weekly Pulse</h3>
      <div class="pulse-grid">
        <div class="pulse-item">
          <div class="pk">Net Client Change</div>
          <div class="pv">${d.total_clients.change > 0 ? '+' : ''}${fmtInt(d.total_clients.change)}</div>
          <div class="pc">${changeSpan(d.total_clients.change)}</div>
        </div>
        <div class="pulse-item">
          <div class="pk">Daily Frequency Downloads (Avg/Episode)</div>
          <div class="prow"><span class="plabel">Kajabi</span><span class="pval">${fmt1(d.daily_frequency.kajabi_avg)}</span>${arrowVal(d.daily_frequency.kajabi_change)}</div>
          <div class="prow"><span class="plabel">Substack</span><span class="pval">${fmt1(d.daily_frequency.substack_avg)}</span>${arrowVal(d.daily_frequency.substack_change)}</div>
        </div>
        <div class="pulse-item">
          <div class="pk">Action Tracker Submissions</div>
          <div class="pv">${fmtInt(d.action_tracker.value)}</div>
          <div class="pc">${changeSpan(d.action_tracker.change)}</div>
        </div>
        <div class="pulse-item">
          <div class="pk">Called to Lead — New This Week</div>
          <div class="pv">${fmtInt(d.called_to_lead.new)}</div>
          <div class="pc">${fmtInt(d.called_to_lead.total)} / ${d.called_to_lead.goal} total (${fmtPct1(d.called_to_lead.progress_pct)} of goal)</div>
        </div>
      </div>
    </div>
  `;
}

function renderMembership() {
  const d = DATA.current_week;
  return `
    <div class="grid">
      <div class="card">
        <h3>IGNITE Other Programs</h3>
        <div class="footnote footnote-top">LAB · Launchpad · Design Hub · Incubator</div>
        <div class="stat"><span class="num">${fmtInt(d.programs.value)}</span>${changeSpan(d.programs.change)}</div>
      </div>
      <div class="card">
        <h3>IGNITE Her University</h3>
        <div class="stat"><span class="num">${fmtInt(d.university.value)}</span>${changeSpan(d.university.change)}</div>
        <div class="footnote">Members access revoked this week: ${fmtInt(d.university.coach_school_access_revoked)}</div>
      </div>
      <div class="card">
        <h3>Red Rebelle Room <span class="badge">${fmtInt(d.red_rebelle.value)} total</span></h3>
        <div class="row"><span class="rlabel">Red Rebelle Drop</span><span class="rval">${fmtInt(d.red_rebelle.drop.value)} ${changeSpan(d.red_rebelle.drop.change)}</span></div>
        <div class="row"><span class="rlabel">Red Rebelle Room</span><span class="rval">${fmtInt(d.red_rebelle.room.value)} ${changeSpan(d.red_rebelle.room.change)}</span></div>
      </div>
    </div>

    <div class="section-title">Soapbox · Upsells &amp; Upgrades · Renewals</div>
    <div class="grid three">
      <div class="card">
        <h3>Substack Soapbox <span class="badge">${fmtInt(d.soapbox.total)} total</span></h3>
        <div class="row"><span class="rlabel">New</span><span class="rval">${fmtInt(d.soapbox.new)}</span></div>
        <div class="row"><span class="rlabel">Monthly</span><span class="rval">${fmtInt(d.soapbox.monthly)}</span></div>
        <div class="row"><span class="rlabel">Yearly</span><span class="rval">${fmtInt(d.soapbox.yearly)}</span></div>
        <div class="row"><span class="rlabel">Total</span><span class="rval">${fmtInt(d.soapbox.total)}</span></div>
      </div>
      <div class="card">
        <h3>Upsells &amp; Upgrades</h3>
        <div class="row"><span class="rlabel">IGNITE Her U</span><span class="rval">${fmtInt(d.upsells.ignite_her_u.value)} ${changeLabel(d.upsells.ignite_her_u.change)}</span></div>
        <div class="row"><span class="rlabel">1:1 Power Hours</span><span class="rval">${fmtInt(d.upsells.power_hour.value)}</span></div>
      </div>
      <div class="card">
        <h3>Renewals</h3>
        <div class="row"><span class="rlabel">Renewed</span><span class="rval">${fmtInt(d.renewals.renewed)}</span></div>
        <div class="row"><span class="rlabel">Not Renewing</span><span class="rval">${fmtInt(d.renewals.not_renewing)}</span></div>
        <div class="row"><span class="rlabel">No Response</span><span class="rval">${fmtInt(d.renewals.no_response)}</span></div>
      </div>
    </div>
  `;
}

function renderEngagement() {
  const d = DATA.current_week;
  return `
    <div class="grid">
      <div class="df-col">
        <div class="card">
          <h3>Daily Frequency Downloads</h3>
          <div class="row row-emph"><span class="rlabel">Kajabi Avg</span><span class="rval">${fmt1(d.daily_frequency.kajabi_avg)} ${changeSpan(d.daily_frequency.kajabi_change)}</span></div>
          <div class="row row-emph"><span class="rlabel">Substack Avg</span><span class="rval">${fmt1(d.daily_frequency.substack_avg)} ${changeSpan(d.daily_frequency.substack_change)}</span></div>
        </div>
        <div class="radio-line">IGNITE Her Radio Downloads — Weekly avg: ${fmt1(d.radio.value)} ${changeSpan(d.radio.change)}</div>
      </div>
      <div class="card">
        <h3>Action Tracker Submissions</h3>
        <div class="stat"><span class="num">${fmtInt(d.action_tracker.value)}</span>${changeSpan(d.action_tracker.change)}</div>
        <div class="footnote">vs previous week</div>
      </div>
      <div class="card">
        <h3>Ignite Her Frequency Guide Certifications</h3>
        <div class="row"><span class="rlabel">Completed</span><span class="rval">${fmtInt(d.coach_school_certifications)}</span></div>
      </div>
    </div>
    <div class="grid two">
      <div class="card">
        <h3>Webinar Unique Viewers</h3>
        <div class="webinar-head"><span>Webinar</span><span>UV / Rate</span></div>
        <div class="webinar-row"><span class="wname">Facilitating Rooms (Tue)</span><span class="wval">${fmtInt(d.webinars.tracie_tuesday)} · ${fmtPct1(d.webinars.tracie_tuesday_rate)}</span></div>
        <div class="webinar-row"><span class="wname">Substack Review (Wed)</span><span class="wval">${fmtInt(d.webinars.substack_review_wed)} · ${fmtPct1(d.webinars.substack_review_wed_rate)}</span></div>
        <div class="webinar-row"><span class="wname">IGNITE Her Frequencies (Thu)</span><span class="wval">${fmtInt(d.webinars.frequencies_thu)} · ${fmtPct1(d.webinars.frequencies_thu_rate)}</span></div>
      </div>
      <div class="card">
        <h3>TGIM Email Engagement</h3>
        <div class="tgim-block">
          <div class="tgim-label">University</div>
          <div class="row"><span class="rlabel">Open</span><span class="rval">${fmtPct(d.tgim.university_open)}</span></div>
          <div class="row"><span class="rlabel">Click</span><span class="rval">${fmtPct(d.tgim.university_click)}</span></div>
        </div>
        <div class="tgim-block">
          <div class="tgim-label">LAB/Launchpad/Incub/Room</div>
          <div class="row"><span class="rlabel">Open</span><span class="rval">${fmtPct(d.tgim.other_open)}</span></div>
          <div class="row"><span class="rlabel">Click</span><span class="rval">${fmtPct(d.tgim.other_click)}</span></div>
        </div>
        <div class="tgim-block">
          <div class="tgim-label">Soapbox</div>
          <div class="row"><span class="rlabel">Open</span><span class="rval">${fmtPct(d.tgim.soapbox_open)}</span></div>
          <div class="row"><span class="rlabel">Click</span><span class="rval">${fmtPct(d.tgim.soapbox_click)}</span></div>
        </div>
      </div>
    </div>
    <div class="footnote" style="margin:4px 0 20px;">New metrics this week: Sales, Webinars and TGIM email rates.</div>
  `;
}

function renderRevenue() {
  const d = DATA.current_week;
  const s = d.sales_revenue;
  const m = d.merch;
  const notesText = `Merch shop sales declined significantly this week: Total Sales ${fmtMoney(m.total_sales)} (${fmtPct1(m.total_sales_pct_change)}), Gross ${fmtMoney(m.gross)} (${fmtPct1(m.gross_pct_change)}), and Orders ${fmtInt(m.orders)} vs ${fmtInt(m.orders && m.orders_change !== null ? m.orders - m.orders_change : null)} last week, following a sales spike driven by the introduction of the new cards.`;
  return `
    <div class="data-notes"><strong>Data Notes</strong>${notesText}</div>
    <div class="grid two">
      <div class="card">
        <h3>Kajabi Revenue <span class="badge">${fmtMoney(s.kajabi.total_gross)} total</span></h3>
        <div class="row"><span class="rlabel">IGNITE Her University</span><span class="rval">${fmtMoney(s.kajabi.ignite_her_university)}</span></div>
        <div class="row"><span class="rlabel">Quantum Leap Incubator</span><span class="rval">${fmtMoney(s.kajabi.quantum_leap_incubator)}</span></div>
        <div class="row"><span class="rlabel">Power Hour</span><span class="rval">${fmtMoney(s.kajabi.power_hour)}</span></div>
      </div>
      <div class="card">
        <h3>Substack Revenue <span class="badge">${fmtMoney(s.substack.total)} total</span></h3>
        <div class="row"><span class="rlabel">Red Rebelle Room</span><span class="rval">${fmtMoney(s.substack.red_rebelle_room)}</span></div>
        <div class="row"><span class="rlabel">Soapbox</span><span class="rval">${fmtMoney(s.substack.soapbox)}</span></div>
      </div>
    </div>
    <div class="grid two">
      <div class="card">
        <h3>Weekly Merch Shop Sales <span class="badge">Shopify</span></h3>
        <div class="row"><span class="rlabel">Gross</span><span class="rval">${fmtMoney(m.gross)} ${changeSpan(m.gross_change)}</span></div>
        <div class="row"><span class="rlabel">Net</span><span class="rval">${fmtMoney(m.net)} ${changeSpan(m.net_change)}</span></div>
        <div class="row"><span class="rlabel">Total Sales</span><span class="rval">${fmtMoney(m.total_sales)} ${changeSpan(m.total_sales_change)}</span></div>
        <div class="row"><span class="rlabel">Orders</span><span class="rval">${m.orders_raw ?? '—'} ${changeSpan(m.orders_change)}</span></div>
        <div class="row"><span class="rlabel">AOV</span><span class="rval">${fmtMoney(m.aov)} ${changeSpan(m.aov_change)}</span></div>
        <div class="row"><span class="rlabel">Returning</span><span class="rval">${fmtPct(m.returning)} ${changeSpan(m.returning_change_pts)}</span></div>
        <div class="footnote">Top seller: ${m.top_sellers || '—'}</div>
      </div>
      <div class="card">
        <h3>Called to Lead Tickets <span class="badge">Event</span></h3>
        <div class="row"><span class="rlabel">Total sold</span><span class="rval">${fmtInt(d.called_to_lead.total)} ${changeSpan(d.called_to_lead.total_change)}</span></div>
        <div class="row"><span class="rlabel">New this week</span><span class="rval">${fmtInt(d.called_to_lead.new)}</span></div>
        <div class="row"><span class="rlabel">Goal</span><span class="rval">${d.called_to_lead.goal}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, d.called_to_lead.progress_pct)}%"></div></div>
        <div class="goal-note">${fmtPct1(d.called_to_lead.progress_pct)} of goal</div>
      </div>
    </div>
  `;
}

function renderScheduling() {
  return `
    <div class="grid two">
      <div class="card">
        <h3>Upcoming Events</h3>
        ${renderList(DATA.upcoming_events)}
      </div>
      <div class="card">
        <h3>Need to Schedule</h3>
        ${renderList(DATA.need_to_schedule)}
      </div>
    </div>
  `;
}

const TABS = [
  { id: 'membership', label: 'Membership & Programs', render: renderMembership },
  { id: 'engagement', label: 'Community & Engagement', render: renderEngagement },
  { id: 'revenue', label: 'Revenue & Sales', render: renderRevenue },
  { id: 'scheduling', label: 'Scheduling', render: renderScheduling },
];

function setTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  const tab = TABS.find(t => t.id === id);
  document.getElementById('app').innerHTML = tab.render();
  document.getElementById('sectionTitle').textContent = tab.label;
  document.getElementById('legendNote').style.display = (id === 'scheduling') ? 'none' : '';
}

function init() {
  const d = DATA.current_week;
  document.getElementById('metaRow').innerHTML = `
    <div class="meta-left">
      <div class="weekly">Weekly Report</div>
      <div class="prevweek">Previous Week: ${d.range}</div>
    </div>
    <div class="meta-right">
      <div class="rd">
        <div class="label">Report Date</div>
        <div class="date">${DATA.report_date_label}</div>
      </div>
    </div>
  `;
  document.getElementById('footerRange').textContent = d.range;
  document.getElementById('hero').innerHTML = heroHTML(d);
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = TABS.map((t,i) => `<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  tabBar.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (btn) setTab(btn.dataset.tab);
  });
  setTab(TABS[0].id);
}

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => { DATA = json; init(); })
  .catch(err => {
    document.getElementById('app').innerHTML = `<p class="empty">Could not load dashboard data (${err}).</p>`;
  });
</script>
</body>
</html>
